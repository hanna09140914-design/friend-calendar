<style>
:root{--ink:#3c3538;--muted:#95888d;--paper:#fffdfb;--line:#eee3e5;--pink:#f8dfe4;--shadow:0 16px 44px #765e6412}*{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,#fff8f7,#f5f1f8);color:var(--ink);font-family:ui-rounded,"PingFang HK",system-ui,sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer;border:0;color:inherit}.app{max-width:1120px;margin:auto;padding:16px 14px 70px}.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}.brand{display:flex;gap:10px;align-items:center}.mark{width:42px;height:42px;border-radius:15px;background:var(--pink);display:grid;place-items:center;font-size:22px;transform:rotate(-7deg)}.eyebrow{font-size:10px;color:var(--muted);letter-spacing:.14em;text-transform:uppercase}.brand h1{margin:2px 0 0;font-size:20px}.actions{display:flex;gap:7px}.icon,.soft{background:var(--paper);border:1px solid var(--line);border-radius:13px;padding:9px 11px;box-shadow:0 4px 14px #765e6408}.hero{height:190px;border-radius:25px;overflow:hidden;position:relative;background:linear-gradient(120deg,#f7d9df,#fff0e7 60%,#dfeef0);box-shadow:var(--shadow);margin-bottom:15px}.hero:after{content:'✦  ♡  ˚';position:absolute;right:22px;top:18px;color:#d9919c;font-size:20px;letter-spacing:11px}.hero-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.hero-shade{position:absolute;inset:0;background:linear-gradient(0deg,#47383c88,transparent 70%)}.hero-copy{position:absolute;left:24px;bottom:22px;z-index:1}.hero h2{margin:0 0 5px;font-size:29px;letter-spacing:-.04em}.hero p{margin:0;font-size:13px;color:#7c6c70}.hero.has-image h2,.hero.has-image p{color:#fff;text-shadow:0 2px 12px #33262a66}.cover{position:absolute;right:20px;bottom:20px;z-index:2;background:#fffbdccc;border:1px solid #fff;border-radius:12px;padding:9px 11px;font-size:12px}.layout{display:grid;grid-template-columns:1fr 290px;gap:16px}.card{background:#fffdfbdd;border:1px solid #eee5e5;border-radius:23px;box-shadow:var(--shadow)}.toolbar{display:flex;align-items:center;gap:8px;margin:10px 2px}.period{font-weight:800;font-size:19px;min-width:160px;text-align:center}.nav{width:31px;height:31px;border:1px solid var(--line);background:var(--paper);border-radius:10px}.grow{flex:1}.tabs{display:flex;background:#eee7e7;border-radius:11px;padding:3px}.tabs button{background:transparent;padding:7px 11px;border-radius:8px;font-size:12px;color:var(--muted)}.tabs button.active{background:#fff;color:var(--ink);box-shadow:0 2px 7px #765e6414}.calendar{padding:10px;overflow:hidden}.weekdays,.monthgrid{display:grid;grid-template-columns:repeat(7,1fr)}.weekday{text-align:center;color:var(--muted);font-size:11px;padding:5px}.day{min-height:92px;padding:6px;border-top:1px solid var(--line);border-left:1px solid var(--line);cursor:pointer}.day:nth-child(7n+1){border-left:0}.day.other{opacity:.38}.day.today .num{background:#d98591;color:#fff}.num{display:grid;place-items:center;width:23px;height:23px;border-radius:50%;font-size:12px}.event{display:block;width:100%;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:5px;padding:4px 5px;border-radius:7px;background:#f8e7ea;font-size:10px;border-left:4px solid #eaa9bd}.weekgrid{display:grid;grid-template-columns:repeat(7,minmax(120px,1fr));gap:7px;overflow:auto}.weekcol{min-height:400px;border:1px solid var(--line);border-radius:15px;padding:7px}.weekhead{font-size:11px;font-weight:800;margin-bottom:8px}.weekevent{font-size:11px;background:#faf0f2;border-left:4px solid #eaa9bd;border-radius:8px;padding:7px;margin:5px 0}.side{display:flex;flex-direction:column;gap:14px}.sidecard{padding:17px}.sidehead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.sidehead h3{margin:0;font-size:15px}.tiny{font-size:11px;color:var(--muted)}.members{display:flex;flex-direction:column;gap:10px}.member{display:flex;align-items:center;gap:9px;font-size:13px}.dot{width:13px;height:13px;border-radius:50%;display:inline-block}.member small{margin-left:auto;color:var(--muted);font-size:11px}.upcoming{display:flex;flex-direction:column;gap:9px}.up{padding:10px 11px;border-radius:13px;background:#fbf4f1;border-left:4px solid #eaa9bd}.up b{display:block;font-size:12px}.up span{display:block;color:var(--muted);font-size:10px;margin-top:4px}.fab{position:fixed;right:22px;bottom:22px;width:57px;height:57px;border-radius:20px;background:var(--ink);color:#fff;font-size:25px;box-shadow:0 12px 27px #3c353855}.modal{position:fixed;inset:0;background:#3c30384a;display:none;align-items:flex-end;justify-content:center;padding:12px;z-index:10}.modal.open{display:flex}.sheet{width:min(600px,100%);max-height:92vh;overflow:auto;background:var(--paper);border-radius:25px;padding:20px;box-shadow:0 25px 80px #3c303833}.sheethead{display:flex;justify-content:space-between;align-items:center}.sheet h3{margin:0;font-size:19px}.close{background:#f1e9e9;border-radius:10px;width:30px;height:30px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:11px}.field{display:flex;flex-direction:column;gap:5px;margin-top:11px}.field.full{grid-column:1/-1}.field label{font-size:11px;color:var(--muted)}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:11px;background:#fff;padding:10px;color:var(--ink)}.field textarea{min-height:72px;resize:vertical}.checks{display:flex;flex-wrap:wrap;gap:7px}.check{border:1px solid var(--line);border-radius:999px;padding:7px 9px;font-size:12px}.formactions{display:flex;gap:8px;margin-top:17px}.formactions button{border-radius:11px;padding:10px 15px}.primary{background:var(--ink);color:#fff}.secondary{background:#f1e9e7}.danger{background:#fff0f1;color:#b95c67;margin-right:auto}.empty{padding:25px;text-align:center;color:var(--muted)}.error{padding:30px;text-align:center}.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,20px);opacity:0;background:var(--ink);color:white;border-radius:12px;padding:10px 14px;font-size:12px;transition:.2s;z-index:30}.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:760px){.app{padding:12px 10px 65px}.hero{height:158px}.hero h2{font-size:25px}.hero-copy{left:18px;bottom:18px}.layout{display:block}.side{display:grid;grid-template-columns:1fr 1fr;margin-top:14px}.sidecard:last-child{grid-column:1/-1}.toolbar{gap:5px}.period{min-width:0;font-size:17px}.calendar{padding:6px}.day{min-height:75px;padding:4px}.event{font-size:9px;padding:3px 4px}.formgrid{grid-template-columns:1fr}.field.full{grid-column:auto}.weekgrid{grid-template-columns:repeat(7,145px)}}
.welcome{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:linear-gradient(145deg,#fff8f5,#f5eef6)}.welcome-card{width:min(430px,100%);text-align:center;background:#fffdfb;border:1px solid #eee3e5;border-radius:30px;padding:28px 22px 24px;box-shadow:0 22px 70px #765e6420}.welcome-art{height:220px;border-radius:24px;background:linear-gradient(145deg,#f8dfe4,#fff1e6 55%,#dceef0);display:grid;place-items:center;position:relative;overflow:hidden;margin-bottom:22px}.welcome-art:before{content:'✦  ♡  ✦';position:absolute;top:18px;right:18px;color:#d9919c;font-size:20px;letter-spacing:7px}.welcome-art:after{content:'☁  ♡  ☁';position:absolute;bottom:16px;left:18px;color:#fff;font-size:25px;letter-spacing:7px}.welcome-figure{font-size:92px;filter:drop-shadow(0 9px 8px #765e6430);transform:rotate(-4deg)}.welcome h1{font-size:32px;letter-spacing:-.06em;margin:0 0 4px}.welcome .sub{color:#95888d;font-size:13px;margin:0 0 20px}.welcome-note{display:inline-block;background:#fbe9e6;border-radius:999px;padding:8px 15px;color:#80696d;font-size:12px;margin-bottom:18px}.welcome-entry{display:flex;gap:8px;background:#fff;border:1px solid #eee3e5;border-radius:16px;padding:6px;margin-bottom:12px}.welcome-entry input{min-width:0;flex:1;border:0;outline:0;text-align:center;color:#3c3538;background:transparent}.welcome-entry button{border-radius:12px;background:#ee8f98;color:#fff;padding:11px 16px}.welcome-cover{display:inline-block;margin:2px 0 14px;background:#fff;border:1px solid #eee3e5;border-radius:12px;padding:9px 12px;color:#80696d;font-size:12px;cursor:pointer}.welcome-cover input{display:none}.welcome-foot{font-size:11px;color:#b0a1a5}.welcome-hidden{display:none!important}</style></head>
<body><section class="welcome" id="welcome"><div class="welcome-card"><div class="welcome-art"><div class="welcome-figure">🌼<br>🐶</div></div><div class="welcome-note">我哋嘅共同日程簿</div><label class="welcome-cover">📷 更換封面圖片<input id="welcomeCover" type="file" accept="image/*"></label><h1>係咪 Friend 先？</h1><p class="sub">our little calendar ♡</p><div class="welcome-entry"><input id="welcomePin" inputmode="numeric" placeholder="輸入 PIN 進入" aria-label="輸入 PIN"><button id="welcomeEnter" type="button">進入</button></div><div class="welcome-foot">私人連結 · 只限收到連結嘅朋友使用</div></div></section><div class="app welcome-hidden" id="app"><header class="top"><div class="brand"><div class="mark">♡</div><div><div class="eyebrow">our little calendar ♡</div><h1>係咪 Friend 先？</h1></div></div><div class="actions"><button class="icon" id="settings" aria-label="朋友設定">⚙</button><button class="icon" id="lock" aria-label="鎖定">⌂</button></div></header><section class="hero" id="hero"><div class="hero-copy"><div class="eyebrow">5 friends · one tiny universe</div><h2 id="calName">Friend Calendar</h2><p>一齊記低我哋嘅小事，慢慢填滿呢個月。♡</p></div><button class="cover" id="coverBtn">更換封面</button></section><main class="layout"><section><div class="toolbar"><button class="nav" id="prev">‹</button><button class="nav" id="today">•</button><div class="period" id="period"></div><button class="nav" id="next">›</button><div class="grow"></div><div class="tabs"><button class="active" data-view="month">月曆</button><button data-view="week">星期</button></div></div><section class="calendar card" id="calendar"></section></section><aside class="side"><section class="sidecard card"><div class="sidehead"><h3>我哋嘅朋友</h3><span class="tiny">5 people</span></div><div class="members" id="members"></div></section><section class="sidecard card"><div class="sidehead"><h3>快到喇</h3><span class="tiny">next up</span></div><div class="upcoming" id="upcoming"></div></section></aside></main></div><button class="fab" id="add" aria-label="新增活動">＋</button><div class="toast" id="toast"></div>
<div class="modal" id="eventModal"><form class="sheet" id="eventForm"><div class="sheethead"><h3 id="formTitle">新增活動</h3><button type="button" class="close" id="closeEvent">×</button></div><input type="hidden" id="eventId"><div class="formgrid"><div class="field full"><label>活動標題 *</label><input id="title" required placeholder="例如：食拉麵、睇戲、生日 tea"></div><div class="field"><label>開始時間</label><input id="start" type="datetime-local" required></div><div class="field"><label>結束時間</label><input id="end" type="datetime-local"></div><div class="field"><label>地點</label><input id="location" placeholder="例如：銅鑼灣 / Online"></div><div class="field"><label>全日活動</label><label><input id="allDay" type="checkbox"> 全日</label></div><div class="field full"><label>參加者</label><div class="checks" id="checks"></div></div><div class="field full"><label>備註</label><textarea id="notes" placeholder="留句俾大家嘅小提示…"></textarea></div></div><div class="formactions"><button type="button" class="danger" id="delete">刪除</button><button type="button" class="secondary" id="cancel">取消</button><button class="primary" type="submit">保存活動 ♡</button></div></form></div>
<div class="modal" id="settingsModal"><form class="sheet" id="settingsForm"><div class="sheethead"><div><div class="eyebrow">our little circle</div><h3>朋友設定</h3></div><button type="button" class="close" id="closeSettings">×</button></div><div class="field"><label>Calendar 名稱</label><input id="nameInput"></div><div class="field"><label>封面圖片（最多 2MB）</label><input id="coverInput" type="file" accept="image/*"></div><div class="field"><label>朋友名稱同顏色</label><div id="memberSettings"></div></div><div class="formactions"><button type="button" class="secondary" id="cancelSettings">取消</button><button class="primary" type="submit">保存設定 ♡</button></div></form></div>
<script>
const API='https://efhbkepmrclxqrluqwld.supabase.co/functions/v1/friend-calendar',token=location.hash.slice(1);let data=null,view='month',cursor=new Date();cursor.setHours(12,0,0,0);const $=id=>document.getElementById(id),$$=s=>[...document.querySelectorAll(s)];
function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function isoDate(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}function localInput(d){return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,16)}function toast(s){$('toast').textContent=s;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),2200)}
async function api(action,payload={}){const r=await fetch(API,{method:'POST',headers:{'content-type':'application/json','x-share-token':token},body:JSON.stringify({action,...payload})});const j=await r.json();if(!r.ok)throw Error(j.error||'Request failed');return j}
async function load(){try{data=await api('load');render()}catch(e){$('app').innerHTML='<div class="error"><div class="mark" style="margin:0 auto 15px">♡</div><h2>私人連結無效</h2><p class="tiny">請用完整嘅 Friend Calendar link 開啟。</p></div>';$('add').style.display='none'}}
function member(id){return data.members.find(m=>m.id===id)||data.members[0]}function eventColor(e){return member((e.member_ids||[])[0])?.color||'#eaa9bd'}function sameDay(e,d){return isoDate(new Date(e.start_at))===isoDate(d)}
function render(){ $('calName').textContent=data.calendar.name;const wa=document.querySelector('.welcome-art');if(wa)wa.style.backgroundImage=data.calendar.cover_image_data_url?'url('+data.calendar.cover_image_data_url+')':'linear-gradient(145deg,#f8dfe4,#fff1e6 55%,#dceef0)';const hero=$('hero');hero.querySelectorAll('.hero-img').forEach(x=>x.remove());if(data.calendar.cover_image_data_url){const im=document.createElement('img');im.className='hero-img';im.src=data.calendar.cover_image_data_url;hero.prepend(im);hero.classList.add('has-image')}else hero.classList.remove('has-image');$('members').innerHTML=data.members.map(m=>'<div class="member"><span class="dot" style="background:'+esc(m.color)+'"></span><span>'+esc(m.name)+'</span><small>'+data.events.filter(e=>(e.member_ids||[]).includes(m.id)).length+' 個活動</small></div>').join('');const upcoming=[...data.events].sort((a,b)=>a.start_at.localeCompare(b.start_at)).slice(0,4);$('upcoming').innerHTML=upcoming.length?upcoming.map(e=>'<div class="up"><b>'+esc(e.title)+'</b><span>'+new Date(e.start_at).toLocaleDateString('zh-HK',{month:'numeric',day:'numeric'})+' · '+(e.all_day?'全日':new Date(e.start_at).toLocaleTimeString('zh-HK',{hour:'2-digit',minute:'2-digit'}))+' · '+esc(e.location||'未定')+'</span></div>').join(''):'<div class="tiny">仲未有活動，按 ＋ 開始啦。</div>';view==='month'?renderMonth():renderWeek()}
function eventHtml(e,week=false){return '<button class="'+(week?'weekevent':'event')+'" data-id="'+esc(e.id)+'" style="border-left-color:'+esc(eventColor(e))+'"><b>'+esc(e.title)+'</b>'+(week?'<br><span class="tiny">'+(e.all_day?'全日':new Date(e.start_at).toLocaleTimeString('zh-HK',{hour:'2-digit',minute:'2-digit'}))+'</span>':'')+'</button>'}
function renderMonth(){const y=cursor.getFullYear(),m=cursor.getMonth(),first=new Date(y,m,1),start=new Date(y,m,1-first.getDay()),today=new Date();$('period').textContent=cursor.toLocaleDateString('zh-HK',{year:'numeric',month:'long'});let h='<div class="weekdays">'+['日','一','二','三','四','五','六'].map(x=>'<div class="weekday">'+x+'</div>').join('')+'</div><div class="monthgrid">';for(let i=0;i<42;i++){const d=new Date(start);d.setDate(start.getDate()+i);h+='<div class="day '+(d.getMonth()!==m?'other ':'')+(d.toDateString()===today.toDateString()?'today':'')+'" data-date="'+isoDate(d)+'"><span class="num">'+d.getDate()+'</span>'+data.events.filter(e=>sameDay(e,d)).map(eventHtml).join('')+'</div>'}$('calendar').innerHTML=h+'</div>';bindCalendar()}
function renderWeek(){const s=new Date(cursor);s.setDate(s.getDate()-s.getDay());$('period').textContent=s.toLocaleDateString('zh-HK',{month:'short',day:'numeric'})+' – '+new Date(s.getFullYear(),s.getMonth(),s.getDate()+6).toLocaleDateString('zh-HK',{month:'short',day:'numeric'});let h='<div class="weekgrid">';for(let i=0;i<7;i++){const d=new Date(s);d.setDate(s.getDate()+i);h+='<div class="weekcol" data-date="'+isoDate(d)+'"><div class="weekhead">'+['日','一','二','三','四','五','六'][i]+' '+d.getDate()+'</div>'+data.events.filter(e=>sameDay(e,d)).map(e=>eventHtml(e,true)).join('')+'</div>'}$('calendar').innerHTML=h+'</div>';bindCalendar()}
function bindCalendar(){$$('.event,.weekevent').forEach(b=>b.onclick=e=>{e.stopPropagation();openEvent(data.events.find(x=>x.id===b.dataset.id))});$$('.day,.weekcol').forEach(x=>x.onclick=()=>openNew(x.dataset.date))}
function checks(ids=[]){$('checks').innerHTML=data.members.map(m=>'<label class="check"><input type="checkbox" value="'+esc(m.id)+'" '+(ids.includes(m.id)?'checked':'')+'> <span class="dot" style="background:'+esc(m.color)+'"></span> '+esc(m.name)+'</label>').join('')}
function openNew(date){const d=date?new Date(date+'T18:00'):new Date();$('eventId').value='';$('formTitle').textContent='新增活動';$('title').value='';$('start').value=localInput(d);$('end').value=localInput(new Date(d.getTime()+3600000));$('location').value='';$('notes').value='';$('allDay').checked=false;checks();$('delete').style.display='none';$('eventModal').classList.add('open')}
function openEvent(e){$('eventId').value=e.id;$('formTitle').textContent='編輯活動';$('title').value=e.title;$('start').value=localInput(new Date(e.start_at));$('end').value=e.end_at?localInput(new Date(e.end_at)):'';$('location').value=e.location||'';$('notes').value=e.notes||'';$('allDay').checked=!!e.all_day;checks(e.member_ids||[]);$('delete').style.display='block';$('eventModal').classList.add('open')}
function close(id){$(id).classList.remove('open')}
$('eventForm').onsubmit=async e=>{e.preventDefault();try{await api('saveEvent',{event:{id:$('eventId').value||null,title:$('title').value.trim(),start_at:new Date($('start').value).toISOString(),end_at:$('end').value?new Date($('end').value).toISOString():null,all_day:$('allDay').checked,location:$('location').value,notes:$('notes').value,member_ids:$$('#checks input:checked').map(x=>x.value)}});close('eventModal');await load();toast('已經記低喇 ♡')}catch(err){alert(err.message)}};
$('delete').onclick=async()=>{if(confirm('確定要刪除呢個活動？')){await api('deleteEvent',{id:$('eventId').value});close('eventModal');await load();toast('活動已刪除')}};$('add').onclick=()=>openNew();$('cancel').onclick=()=>close('eventModal');$('closeEvent').onclick=()=>close('eventModal');$('prev').onclick=()=>{view==='month'?cursor.setMonth(cursor.getMonth()-1):cursor.setDate(cursor.getDate()-7);render()};$('next').onclick=()=>{view==='month'?cursor.setMonth(cursor.getMonth()+1):cursor.setDate(cursor.getDate()+7);render()};$('today').onclick=()=>{cursor=new Date();cursor.setHours(12,0,0,0);render()};$$('[data-view]').forEach(b=>b.onclick=()=>{view=b.dataset.view;$$('[data-view]').forEach(x=>x.classList.toggle('active',x===b));render()});
$('settings').onclick=()=>{$('nameInput').value=data.calendar.name;$('memberSettings').innerHTML=data.members.map(m=>'<div class="formgrid"><div class="field"><input class="mname" data-id="'+esc(m.id)+'" value="'+esc(m.name)+'"></div><div class="field"><input class="mcolor" data-id="'+esc(m.id)+'" type="color" value="'+esc(m.color)+'"></div></div>').join('');$('coverInput').value='';$('settingsModal').classList.add('open')};$('closeSettings').onclick=$('cancelSettings').onclick=()=>close('settingsModal');$('settingsForm').onsubmit=async e=>{e.preventDefault();const f=$('coverInput').files[0];let cover;if(f){if(f.size>2*1024*1024)return alert('圖片請小於 2MB');cover=await new Promise(r=>{const x=new FileReader();x.onload=()=>r(x.result);x.readAsDataURL(f)})}const members=data.members.map(m=>({id:m.id,name:document.querySelector('.mname[data-id="'+m.id+'"]').value,color:document.querySelector('.mcolor[data-id="'+m.id+'"]').value}));try{await api('saveSettings',{name:$('nameInput').value,members,cover_image_data_url:cover});close('settingsModal');await load();toast('朋友設定已更新 ♡')}catch(err){alert(err.message)}};$('coverBtn').onclick=()=>$('settings').click();$('lock').onclick=()=>{location.href=location.pathname};
if(!token){$('app').innerHTML='<div class="error"><div class="mark" style="margin:0 auto 15px">♡</div><h2>需要私人 Calendar link</h2><p class="tiny">請用完整嘅共享連結開啟。</p></div>';$('add').style.display='none'}else load();
